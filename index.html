  // ═══ SCORING ══════════════════════════════════════════════════════
function calcArchetype(){
  const q=answers;
  const s={
    anchor:(q[2]+q[7]+q[13])/3,
    holdingSpace:(q[6]+q[13]+(6-q[8]))/3,
    catalyst:(q[11]+q[3]+q[1])/3,
    guidingLight:(q[2]+q[11]+q[13])/3,
    temperingFlame:(q[9]+(6-q[0]))/2,
    secureHaven:(q[5]+q[12]+q[10])/3
  };
  const order=['secureHaven','anchor','holdingSpace','catalyst','guidingLight','temperingFlame'];
  let best='secureHaven',bestScore=-1;
  order.forEach(k=>{if(s[k]>bestScore){bestScore=s[k];best=k;}});
  return best;
}
function detectTrack(){
  const q=answers;
  const anx=(q[1]+q[7])/2, av=(q[5]+q[12])/2;
  if(anx>=3.5&&av<3)return'anxious';
  if(av>=3.5&&anx<3)return'avoidant';
  if(anx>=3.5&&av>=3.5)return'anxious';
  return'balanced';
}
function calcMatchPct(key){
  const q=answers;
  const raw={anchor:(q[2]+q[7]+q[13])/3,holdingSpace:(q[6]+q[13]+(6-q[8]))/3,catalyst:(q[11]+q[3]+q[1])/3,guidingLight:(q[2]+q[11]+q[13])/3,temperingFlame:(q[9]+(6-q[0]))/2,secureHaven:(q[5]+q[12]+q[10])/3}[key];
  return Math.min(97,Math.max(65,Math.round(65+((raw-1)/4)*32)));
}

  function runLoadingCycle() {
    const msgs = LOADING_MSGS, insights = INSIGHTS[track];
    let msgI = 0, insightI = 0;
    const msgEl = () => document.getElementById('loading-msg');
    const baseCycle = setInterval(() => {
      msgI = (msgI+1) % msgs.length;
      if (msgEl()) msgEl().textContent = msgs[msgI];
    }, 560);
    setTimeout(() => {
      clearInterval(baseCycle);
      if (msgEl()) { msgEl().style.fontStyle='italic'; msgEl().style.fontSize='14px'; msgEl().textContent = insights[insightI]; }
      const insightCycle = setInterval(() => {
        insightI = (insightI+1) % insights.length;
        if (msgEl()) msgEl().textContent = insights[insightI];
        else clearInterval(insightCycle);
      }, 900);
    }, 1400);
    setTimeout(() => { screen='result'; render(); }, 3200);
  }

  /* ═══ ACTIONS ═══ */
  function startQuiz() { screen='quiz'; currentQ=0; render(); }

  let _t=null;
  function selectAnswer(val) {
    clearTimeout(_t);
    answers[currentQ] = val;
    render();
    _t = setTimeout(nextQuestion, 420);
  }

  function nextQuestion() {
    if (answers[currentQ]===undefined) return;
    if (currentQ < TOTAL-1) {
      currentQ++;
      render();
    } else {
      archKey = calcArchetype();
      track = detectTrack();
      screen='loading';
      render();
      runLoadingCycle();
    }
  }

  function goBack() {
    if (currentQ>0) { currentQ--; screen='quiz'; } else { screen='intro'; }
    render();
  }

  function restartQuiz() {
    currentQ=0; answers=[]; archKey=null; track='balanced'; screen='intro';
    render();
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
  </script>
</body>
